<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Drama Video Player</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    .box {
      max-width: 800px;
      margin: auto;
      background: #020617;
      padding: 20px;
      border-radius: 10px;
    }
    input, button {
      padding: 10px;
      width: 100%;
      margin: 6px 0;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #22c55e;
      font-weight: bold;
      cursor: pointer;
    }
    ul li {
      margin: 10px 0;
      cursor: pointer;
      color: #38bdf8;
    }
    ul li:hover {
      text-decoration: underline;
    }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🎬 Drama Episode Player</h2>

  <input id="url" placeholder="URL drama" />
  <input id="start" type="number" placeholder="Episode awal" value="1" />
  <input id="end" type="number" placeholder="Episode akhir" value="3" />

  <button onclick="generate()">Generate & Fetch Video</button>

  <ul id="list"></ul>

  <video id="player" controls></video>
</div>

<script>
  const list = document.getElementById("list");
  const player = document.getElementById("player");

  function cleanTitle(url) {
    const slug = url.split("/").pop().replace(/-\d+$/, "");
    return slug
      .split("-")
      .map(w => w[0].toUpperCase() + w.slice(1))
      .join(" ");
  }

  async function fetchVideoUrl(episodeUrl) {
    const res = await fetch(episodeUrl, {
      headers: {
        "User-Agent": "Mozilla/5.0"
      }
    });

    const html = await res.text();

    const block = html.match(
      /<video[^>]+id=["']player["'][\s\S]*?<\/video>/i
    );

    if (!block) return null;

    const src = block[0].match(
      /<source[^>]+src=["']([^"']+)["']/
    );

    return src ? src[1] : null;
  }

  async function generate() {
    list.innerHTML = "";
    player.src = "";

    const baseUrl = document.getElementById("url").value.trim();
    const start = +document.getElementById("start").value;
    const end = +document.getElementById("end").value;
    const title = cleanTitle(baseUrl);

    for (let ep = start; ep <= end; ep++) {
      const li = document.createElement("li");
      li.textContent = `${title} – Episode ${ep}`;
      list.appendChild(li);

      const epUrl = `${baseUrl}?ep=${ep}`;

      li.onclick = async () => {
        li.textContent = `⏳ Loading Episode ${ep}...`;

        try {
          const videoUrl = await fetchVideoUrl(epUrl);

          if (!videoUrl) {
            li.textContent = `❌ Episode ${ep} (video not found)`;
            return;
          }

          player.src = videoUrl;
          player.play();

          li.textContent = `▶ ${title} – Episode ${ep}`;
        } catch (e) {
          li.textContent = `❌ Episode ${ep} (error)`;
        }
      };
    }
  }
</script>

</body>
</html>
